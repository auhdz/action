<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Action — preview</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --accent: rgb(0, 115, 230);
      --text: #000;
      --secondary: rgba(60, 60, 67, 0.6);
      --tertiary: rgba(60, 60, 67, 0.3);
      --card-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .phone {
      max-width: 430px;
      min-height: 100%;
      margin: 0 auto;
      position: relative;
      background: #fff;
    }

    .content {
      padding: 16px 24px 24px;
    }

    h1 {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.35;
      color: var(--secondary);
    }

    .status {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--secondary);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      flex-shrink: 0;
    }

    .dot.warn { background: #ff9500; }
    .dot.muted { background: #c7c7cc; }

    .detail {
      font-size: 12px;
      color: var(--tertiary);
      padding-left: 16px;
    }

    .hint {
      margin-top: 32px;
      font-size: 12px;
      color: var(--tertiary);
      line-height: 1.5;
    }

    .map-card {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 180px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.06);
      z-index: 2;
      background: #e8e8ed;
    }

    .map-card #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255, 255, 255, 0.85) !important;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="map-card" aria-label="Map preview">
      <div id="map"></div>
    </div>

    <div class="content">
      <h1>Action</h1>
      <p class="subtitle">Your corner map and live ping status.</p>

      <div class="status">
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <span id="statusTitle">Location…</span>
        </div>
        <div class="detail" id="statusDetail">Requesting browser location for this preview.</div>
      </div>

      <p class="hint">
        Browser preview only — layout matches the SwiftUI app. The real app runs in Xcode on a simulator or device.
      </p>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    (function () {
      var la = [34.0522, -118.2437];
      var map = L.map("map", {
        zoomControl: false,
        attributionControl: true,
      }).setView(la, 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      }).addTo(map);

      var marker = L.circleMarker(la, {
        radius: 6,
        fillColor: "#007AFF",
        color: "#fff",
        weight: 2,
        opacity: 1,
        fillOpacity: 1,
      }).addTo(map);

      var dot = document.getElementById("statusDot");
      var title = document.getElementById("statusTitle");
      var detail = document.getElementById("statusDetail");

      function setStatus(kind, t, d) {
        dot.className = "dot" + (kind === "warn" ? " warn" : kind === "muted" ? " muted" : "");
        title.textContent = t;
        detail.textContent = d;
      }

      if (!navigator.geolocation) {
        setStatus("warn", "Location unavailable", "This browser did not expose geolocation; map centered on Los Angeles.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var ll = [lat, lng];
          map.setView(ll, 14);
          marker.setLatLng(ll);
          setStatus(
            "ok",
            "Location on",
            "Preview at " + lat.toFixed(4) + ", " + lng.toFixed(4) + " (browser geolocation)."
          );
        },
        function () {
          setStatus(
            "warn",
            "Location blocked",
            "Allow location for this page to move the pin, or use the LA default."
          );
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    })();
  </script>
</body>
</html>
